# cargo-deny configuration
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Source of truth for ignored RUSTSEC advisories. CI's cargo-lockpatrol
# reads this list directly. `cargo audit` has no project-level config, so
# the prek hook in `.pre-commit-config.yaml` mirrors it as `--ignore` flags.
ignore = [
    # Unmaintained crates pulled transitively by Leptos (view! macro + reactive
    # graph). Not vulnerabilities; no safe upgrades; the fix is upstream in
    # Leptos. Revisit when Leptos drops them.
    "RUSTSEC-2026-0173", # proc-macro-error2 (via leptos_macro)
    "RUSTSEC-2024-0436", # paste (via leptos / tachys)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path deps (e.g. `slp-core = { path = "../slp-core" }`) have no
# version requirement and would otherwise read as wildcards; allow those while
# still denying real `*` versions on registry deps.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# leptotes and theoria were incubated here and now live in their own repos;
# slp tracks their `main` until they publish. slp-e2e dogfoods
# playwright-rust's `main`.
allow-git = [
    "https://github.com/padamson/leptotes",
    "https://github.com/padamson/playwright-rust",
    "https://github.com/padamson/theoria",
]

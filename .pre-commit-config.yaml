# Pre-commit hooks for Rust projects
# Install: cargo install prek && prek install
# Run manually: prek run

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: mixed-line-ending
        name: Fix mixed line endings

  - repo: https://github.com/crate-ci/typos
    rev: v1.26.8
    hooks:
      - id: typos
        name: Check for typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Auto-format Rust code
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      # slp-app and slp-e2e are outside the workspace, so `--all` above
      # skips them.
      - id: cargo-fmt-app
        name: cargo fmt (slp-app)
        description: Auto-format the excluded app crate
        entry: cargo fmt --manifest-path crates/slp-app/Cargo.toml
        language: system
        files: ^crates/slp-app/.*\.rs$
        pass_filenames: false

      - id: cargo-fmt-e2e
        name: cargo fmt (slp-e2e)
        description: Auto-format the excluded e2e crate
        entry: cargo fmt --manifest-path crates/slp-e2e/Cargo.toml
        language: system
        files: ^crates/slp-e2e/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy linter
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check Rust code compiles
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest run
        description: Run tests with nextest
        entry: cargo nextest run --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-doctest
        name: cargo test --doc
        description: Run documentation tests
        entry: cargo test --doc --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # cargo deny checks licenses, bans and sources. Advisories go through
      # cargo-lockpatrol, the hook at the end of this file, the same checker
      # as the CI gate and the monitor, which reads every tracked Cargo.lock
      # and the one ignore list in `deny.toml`. Both are diff-gated on
      # purpose: an advisory published overnight should not block an
      # unrelated commit; the scheduled advisory monitor catches those.
      - id: cargo-deny
        name: cargo deny
        description: Check licenses, bans, and source restrictions
        entry: cargo deny --workspace check bans licenses sources
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock|deny\.toml)$

      - id: cargo-vet
        name: cargo vet
        description: Verify dependency supply chain audits
        entry: cargo vet
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock|supply-chain/)$

  # Builds the binary at the pinned rev (prek runs `cargo install`). Keep
  # it at the release the monitor and the CI gate run. Needs cargo-deny on
  # PATH. Dependabot's pre-commit entry moves this rev.
  - repo: https://github.com/padamson/cargo-lockpatrol
    rev: e791845e4a03af540c2348755c3695041cdd54fd  # frozen: v0.2.0
    hooks:
      - id: cargo-lockpatrol

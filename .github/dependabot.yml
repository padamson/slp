version: 2
updates:
  - package-ecosystem: "cargo"
    # Every Cargo.lock, not just the workspace's. slp-app and slp-e2e are
    # excluded from the workspace (so `cargo --workspace` stays native) and
    # each resolves its own lock; a manifest bump that only touched the root
    # lock left those stale until the next local build silently re-resolved
    # them. One PR per group spans all three.
    directories:
      - "/"
      - "/crates/slp-app"
      - "/crates/slp-e2e"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Wait before proposing a bump. cargo-vet's import sets (Mozilla, Google,
    # ISRG, ...) have not audited a version that is hours old, so day-zero
    # bumps fail Supply Chain Review by construction and the only response
    # is an exemption nobody audited. A week of lag lets the upstream audits
    # land first, skips releases that get yanked, and lets advisories
    # surface before adoption. Longer for majors, the riskiest and least
    # urgent.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Grouping keeps the weekly run to as few PRs as possible. Every cargo PR
    # edits Cargo.lock, so two open cargo PRs conflict the moment one merges
    # and the second must rebase and re-run CI; with N PRs the auto-merge
    # cascade costs O(N^2) runs. No merge machinery avoids a lockfile
    # conflict; fewer PRs is the fix.
    groups:
      # Listed first: a dependency joins the first group it matches, and a
      # git-pinned bump carries no semver update-type, so the filtered
      # groups below can never claim it.
      git-dependencies:
        patterns:
          - "playwright-rs"
          - "leptotes"
          - "theoria*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Only default-days here: Dependabot's schema rejects the per-semver keys
    # for github-actions, and one bad key invalidates this whole file.
    cooldown:
      default-days: 7
    # One PR for the week's action bumps, same cascade rationale as cargo,
    # except create-github-app-token, the one action dependabot-auto-merge.yml
    # runs. Its bump gets a PR of its own, which that workflow holds for a
    # hand merge from its first push. Inside the group it would hold every
    # other bump with it, or join a group PR already set to auto-merge after
    # an earlier push that bumped only other actions: the hold check is not
    # required, so that PR would merge unreviewed.
    groups:
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/create-github-app-token"

  # Hook revs in .pre-commit-config.yaml, cargo-lockpatrol's among them.
  # cargo-lockpatrol's hook rev moves here, its monitor pin in the actions
  # PR above, and the CI gate's with the rust-ci-workflows pin, so they can
  # sit a release apart for a while.
  # Only default-days, as for github-actions.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"

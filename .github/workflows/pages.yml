name: Deploy

# Continuous deployment to GitHub Pages (production). Runs only after the Test
# workflow succeeds on main — so the playwright-rust e2e dogfood gate must pass
# before anything ships. main -> prod, no staging (the planner is a personal,
# backend-free static bundle).
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs, as in GitHub's Pages starters other
  # than the static one: deploy-pages looks the artifact up by name, and the
  # listing it reads can lag a just-finalized upload by seconds
  # (actions/deploy-pages#451), so a lookup in the same job finds nothing.
  build:
    name: Build for Pages
    # Gate: only deploy when the triggering Test run passed on a push to main
    # (or on a manual dispatch from main). `branches: [main]` matches a head
    # branch by name, so a pull request from a fork's `main` would match it
    # too; the event check keeps that run from deploying.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The commit the Test run passed, not main's tip, which may have moved
      # on to a commit still under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: deploy
      - name: Install Trunk
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: trunk
          fallback: none
      # Project page is served under https://padamson.github.io/slp/, so the
      # bundle's asset URLs must be rooted at /slp/.
      - name: Build app (release, project-page base path)
        run: cd crates/slp-app && trunk build --release --public-url /slp/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: crates/slp-app/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages proves the run's identity with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # The job boundary is usually enough delay, but the lag has been seen
      # at tens of seconds, so a miss gets one retry a minute later.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - name: Retry the deploy
        id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

name: Security & Quality

# The supply-chain gates and mutation testing come from rust-ci-workflows,
# pinned by SHA so Dependabot's github-actions entry moves them. Each called
# job reports as `<caller job> / <job name>`, so the required checks are
# `supply-chain / License & Dependency Check` and
# `supply-chain / Supply Chain Review`. The local half (deny.toml,
# supply-chain/, .cargo/mutants.toml, the prek hooks) stays in this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Saturday 5am ET; also runs the full mutation sweep.
    - cron: '0 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # cargo deny (bans, licenses, sources), cargo-lockpatrol's advisory check
  # over every tracked Cargo.lock against deny.toml's ignore list, and
  # cargo vet. slp-app and slp-e2e are excluded from the workspace and keep
  # their own lockfiles, so deny checks them separately; vet covers the
  # workspace only.
  supply-chain:
    uses: padamson/rust-ci-workflows/.github/workflows/supply-chain.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
    with:
      deny-manifests: |
        crates/slp-app
        crates/slp-e2e

  # The per-diff run on push and pull request, the full sweep on schedule
  # and dispatch. Scope and exclusions: .cargo/mutants.toml; policy:
  # docs/mutation-testing.md. No crate publishes, so there is no semver
  # preview.
  mutation:
    uses: padamson/rust-ci-workflows/.github/workflows/mutation.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
